services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345
      - POSTGRES_DB=grc_db
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d grc_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: [ "/app/api" ]
    ports:
      - "8081:8081"
    environment:
      - DB_URL=postgresql://postgres:12345@db:5432/grc_db?sslmode=disable
      - SERVER_ADDR=0.0.0.0:8081
      - NATS_URL=nats://nats:4222
      - TOKEN_SECRET=25381ce024479e390c9b68a416a24694
      - TOKEN_DURATION=24h
      - REFRESH_TOKEN_DURATION=168h
      - FRONTEND_URL=http://localhost
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=srivastavaranika@gmail.com
      - SMTP_PASSWORD=uaucdpmmzknjrpft
      - SMTP_FROM_EMAIL=srivastavaranika@gmail.com
      - SMTP_FROM_NAME=GRC Compliance System
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: [ "/app/worker" ]
    environment:
      - DB_URL=postgresql://postgres:12345@db:5432/grc_db?sslmode=disable
      - NATS_URL=nats://nats:4222
      - TOKEN_SECRET=25381ce024479e390c9b68a416a24694
      - TOKEN_DURATION=24h
      - REFRESH_TOKEN_DURATION=168h
      - FRONTEND_URL=http://localhost
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=srivastavaranika@gmail.com
      - SMTP_PASSWORD=uaucdpmmzknjrpft
      - SMTP_FROM_EMAIL=srivastavaranika@gmail.com
      - SMTP_FROM_NAME=GRC Compliance System
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - PORT=3000
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:


