networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

x-backend-env: &backend-env
  env_file:
    - .env
  networks:
    - backend-net
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: '0.5'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grc_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  nats:
    image: nats:latest
    command: ["-js"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - nats_data:/data
    networks:
      - backend-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/start.sh", "echo", "Migration complete"]
    <<: *backend-env
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/api"]
    ports:
      - "8081:8081"
    environment:
      - SERVER_ADDR=0.0.0.0:8081
    <<: *backend-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/worker"]
    <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  # Global Entrypoint (Publicly Exposed & Integrated Frontend)
  nginx:
    build:
      context: ./
      dockerfile: ./frontend/Dockerfile
      target: prod
    ports:
      - "80:80"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'

volumes:
  postgres_data:
  nats_data:


