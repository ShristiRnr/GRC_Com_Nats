services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=shristi
      - POSTGRES_DB=grc_db
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grc_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/api"]
    ports:
      - "8081:8081"
    environment:
      - DB_URL=postgresql://postgres:shristi@db:5432/grc_db?sslmode=disable
      - SERVER_ADDR=0.0.0.0:8081
      - NATS_URL=nats://nats:4222
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/worker"]
    environment:
      - DB_URL=postgresql://postgres:shristi@db:5432/grc_db?sslmode=disable
      - NATS_URL=nats://nats:4222
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started

volumes:
  postgres_data:
