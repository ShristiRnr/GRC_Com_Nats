services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=shristi
      - POSTGRES_DB=grc_db
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d grc_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"

  api:
    build:
      context: ./backend
    environment:
      - DB_URL=postgresql://postgres:shristi@db:5432/grc_db?sslmode=disable
      - NATS_URL=nats://nats:4222
      - SERVER_ADDR=0.0.0.0:8080
      - TOKEN_SECRET=25381ce024479e390c9b68a416a24694
      - TOKEN_DURATION=24h
      - REFRESH_TOKEN_DURATION=168h
      - FRONTEND_URL=http://localhost:5173
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=srivastavaranika@gmail.com
      - SMTP_PASSWORD=uaucdpmmzknjrpft
      - SMTP_FROM_EMAIL=srivastavaranika@gmail.com
      - SMTP_FROM_NAME=GRC Compliance System
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
    command: [ "/app/api" ]

  worker:
    build:
      context: ./backend
    environment:
      - DB_URL=postgresql://postgres:shristi@db:5432/grc_db?sslmode=disable
      - NATS_URL=nats://nats:4222
      - TOKEN_SECRET=25381ce024479e390c9b68a416a24694
      - TOKEN_DURATION=24h
      - REFRESH_TOKEN_DURATION=168h
      - FRONTEND_URL=http://localhost:5173
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=srivastavaranika@gmail.com
      - SMTP_PASSWORD=uaucdpmmzknjrpft
      - SMTP_FROM_EMAIL=srivastavaranika@gmail.com
      - SMTP_FROM_NAME=GRC Compliance System
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
    command: [ "/app/worker" ]

  frontend:
    build:
      context: .
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - api
